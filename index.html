<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 1 - Mapa animales</title>
    <link rel="stylesheet" href="CSS/fonts.css">
    <link id="color-palette" rel="stylesheet" href="CSS/default-palette.css">
    <link rel="stylesheet" href="CSS/map-style.css">
    <link rel="stylesheet" href="CSS/book-style.css">
    <link rel="stylesheet" href="CSS/animal-card.css">
</head>

<body>
    <div id="map-container">
        <div id="header">
            <div id="logo-container">
                <h1 class="cardenio-bold" id="logo">Animal Guide</h1>
            </div>
            <div id="search-bar">
                <div>
                    <input id="search-bar-input" class="cardenio-regular" type="text" placeholder="Search an animal"
                        oninput="searchAnimal()">
                    <div id="search-bar-icon">
                        <img class="icon" src="icons/icon-search.svg" alt="">
                    </div>
                </div>

                <ul id="search-results">
                    <!-- <li class="search-result"></li> -->
                </ul>

            </div>

            <div id="filter-settings-container">
                <div id="style-button" onclick="changePalette()">
                    <img class="icon" src="icons/icon-palette-color.svg" alt="">
                </div>
                <div id="filter-settings-button" onclick="openFilters()">
                    <span class="label cardenio-regular">filters</span>
                    <img src="icons/icon-filters.svg" alt="">
                </div>




            </div>
        </div>

        <div id="filter-options-container">
            <div id="filter-title">
                <p class="cardenio-regular">Filter by</p>
                <div onclick="closeFilters()">
                    <img class="close-icon" src="icons/icon-close.svg" alt="">
                </div>
            </div>

            <div id="filters-content">
                <div id="category-filter">
                    <p class="filter-label cardenio-bold">Category</p>
                    <div class="filter-options">
                        <div id="mammals" class="filter-option">
                            <p class="cardenio-regular">Mammals</p>
                        </div>
                        <div id="birds" class="filter-option">
                            <p class="cardenio-regular">Birds</p>
                        </div>
                        <div id="fish" class="filter-option">
                            <p class="cardenio-regular">Fish</p>
                        </div>
                        <div id="reptiles" class="filter-option">
                            <p class="cardenio-regular">Reptiles</p>
                        </div>
                        <div id="amphibians" class="filter-option">
                            <p class="cardenio-regular">Amphibians</p>
                        </div>
                        <div id="insects" class="filter-option">
                            <p class="cardenio-regular">Insects</p>
                        </div>
                        <div id="invertebrates" class="filter-option">
                            <p class="cardenio-regular">Invertebrates</p>
                        </div>
                    </div>
                </div>
                <div id="conservation-status-filter">

                    <p class="filter-label cardenio-bold">Conservation status</p>

                    <div class="filter-options">
                        <div id="mammals" class="filter-option">
                            <p class="cardenio-regular">Critically endangered</p>
                        </div>
                        <div id="birds" class="filter-option">
                            <p class="cardenio-regular">Endangered</p>
                        </div>
                        <div id="fish" class="filter-option">
                            <p class="cardenio-regular">Vulnerable</p>
                        </div>
                        <div id="reptiles" class="filter-option">
                            <p class="cardenio-regular">Near threatened</p>
                        </div>
                        <div id="amphibians" class="filter-option">
                            <p class="cardenio-regular">Least concern</p>
                        </div>
                        <div id="insects" class="filter-option">
                            <p class="cardenio-regular">Domesticated</p>
                        </div>
                        <div id="invertebrates" class="filter-option">
                            <p class="cardenio-regular">Not Evaluated</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="circles-container">
            <div class="circle" id="circle-europe">

            </div>
            <div class="circle" id="circle-africa">

            </div>
            <div class="circle" id="circle-north-america">

            </div>
            <div class="circle" id="circle-south-america">

            </div>
            <div class="circle" id="circle-oceania">

            </div>
            <div class="circle" id="circle-asia">

            </div>
            <div class="circle" id="circle-antarctica">

            </div>
            <div class="circle" id="circle-oceans">

            </div>

        </div>

        <div id="continents-container">

        </div>
    </div>

    <script src="map.js"></script>
    <script src="style-layout.js"></script>
    <script src="animal-card.js"></script>
    <script src="search-bar.js"></script>
    <script src="filters.js"></script>
    <!-- <script type="module" src="apps.js"></script> -->
</body>

</html>
