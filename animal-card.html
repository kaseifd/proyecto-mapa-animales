<div id="${animal}-info" class="animal-info">
    <div id="left-page">
        <div id="back-button">
            <img class="icon" src="icons/icon-back.svg" alt="">
        </div>

        <div id="animal-photo">
            <img src="" alt="">
        </div>
        <div id="animal-description">
            <p class="inter-regular">Lions are large social cats native to sub-Saharan Africa, with a small population in India's Gir Forest. They live in groups called prides, can weigh up to 250 kg (550 lb), and often hunt cooperatively. Wild lions typically live 10 to 14 years.</p>
        </div>
    </div>
    <div id="right-page">
        <div id="animal-name">
           <h2 class="cardenio-bold">Lion</h2>
            <h3 class="italianno-regular">Panthera leo</h3> 
        </div>
        


        <div id="close-button">
            <img class="icon" src="icons/icon-close.svg" alt="">
        </div>
    </div>
</div>
